<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZooVigilante 🐾 - Denúncia Recebida</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Usando a imagem 1, como preferiu para esta página */
            background-image: url('1.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            color: #2c3e50;
        }
        
        /* A mesma caixa do título vibrante para manter a coerência da marca */
        .header-box {
            background: linear-gradient(135deg, #ff8c00, #ff5722);
            padding: 10px 40px;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(255, 87, 34, 0.4);
            margin-bottom: 25px;
            text-align: center;
            border: 3px solid #fff;
        }

        .header-title {
            color: #ffffff;
            font-size: 2.2em;
            margin: 0;
            letter-spacing: 1px;
            font-weight: 900;
        }

        /* Container claro estilo vidro */
        .container {
            max-width: 550px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.85); /* Fundo branco translúcido */
            padding: 50px 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            backdrop-filter: blur(8px);
            box-sizing: border-box;
            border: 2px solid rgba(255,255,255,0.5);
        }

        h2 {
            color: #ff5722;
            margin-bottom: 20px;
            font-size: 1.6em;
            line-height: 1.3;
        }

        p {
            font-size: 1.15em;
            line-height: 1.5;
            margin-bottom: 30px;
            font-weight: 600;
            color: #444; /* Cinzento escuro para melhor legibilidade */
        }

        /* O botão verde de sucesso que convida à ação */
        .btn-app {
            display: inline-block;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            padding: 18px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            text-transform: uppercase;
            font-size: 1.1em;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(76, 175, 80, 0.4);
        }

        /* Animação do botão ao passar o rato (mouse) */
        .btn-app:hover { 
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.6);
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1 class="header-title">ZOOVIGILANTE 🦸‍♂️🐾</h1>
    </div>

    <div class="container">
        
        <h2>SEJA RESPONSÁVEL PELA FELICIDADE DE UMA VIDA 🥰🐶</h2>
        
        <p>A sua denúncia chega direto a quem pode agir, com prioridade inteligente. 🚓⚡</p>
        
        <a href="#" class="btn-app">Baixe o Aplicativo e Faça a Diferença 📲</a>
    </div>

</body>
</html>
